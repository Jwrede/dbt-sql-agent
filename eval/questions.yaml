    select p.category from marts.fct_order_lines l join marts.fct_orders o using (order_id) join marts.dim_products p using (product_id)
    where o.is_revenue group by p.category
    order by sum(l.net_amount) filter (where o.order_date >= '2025-01-01') - sum(l.net_amount) filter (where o.order_date < '2025-01-01') desc limit 1
