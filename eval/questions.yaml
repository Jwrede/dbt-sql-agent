# Harder questions (window functions, comparisons between periods, cohort logic).
- id: h01
  kind: answer
  tags: [hard, definition, time]
  question: How many customers had revenue in 2024 and less than half of that revenue in 2025?
  gold_sql: >
    select count(*) from (select customer_id,
      sum(net_revenue) filter (where order_date < '2025-01-01') as r24,
      coalesce(sum(net_revenue) filter (where order_date >= '2025-01-01'), 0) as r25
    from marts.fct_orders where is_revenue group by customer_id) t where r24 > 0 and r25 < r24 / 2
- id: h02
  kind: answer
  tags: [hard, definition, time]
  question: Of the customers with a completed order in 2024, what percentage also had a completed order in 2025?
  gold_sql: >
    select round(100.0 * count(*) filter (where b25) / count(*), 2) from (select customer_id,
      bool_or(order_date >= '2025-01-01') as b25, bool_or(order_date < '2025-01-01') as b24
    from marts.fct_orders where is_revenue group by customer_id) t where b24
- id: h03
  kind: answer
  tags: [hard, definition, time]
  ordered: true
  question: Show the month-over-month revenue growth in percent for each month of 2025, in calendar order.
  gold_sql: >
    with m as (select order_month, sum(net_revenue) as rev from marts.fct_orders where is_revenue group by 1)
    select order_month, round(100 * (rev / lag(rev) over (order by order_month) - 1), 2) as growth_pct
    from m order by order_month offset 12
- id: h04
  kind: answer
  tags: [hard, definition, join, time]
  question: Which product category had the largest revenue increase in EUR from 2024 to 2025?
